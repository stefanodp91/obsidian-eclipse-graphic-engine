name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const tag = process.env.RELEASE_TAG ?? '';
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`Release tag must have the form vX.Y.Z; received ${tag}`);
          }

          const expected = tag.slice(1);
          const manifests = [
            'package.json',
            'packages/core/package.json',
            'packages/capacitor/package.json',
            'samples/endless-platformer/package.json',
            'samples/endless-platformer-capacitor/package.json',
            'samples/endless-platformer/models/package.json',
          ];

          for (const path of manifests) {
            const manifest = JSON.parse(readFileSync(path, 'utf8'));
            if (manifest.version !== expected) {
              throw new Error(`${path}: version ${manifest.version} does not match tag ${tag}`);
            }
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run checks and builds
        run: npm run check

      - name: Package release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          npm pack --workspace obsidian-eclipse-graphic-engine --pack-destination release-assets
          npm pack --workspace obsidian-eclipse-capacitor-plugins --pack-destination release-assets
          cd samples/endless-platformer
          zip -qr "../../release-assets/endless-platformer-${version}.zip" dist
          cd ../../release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
